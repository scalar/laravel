name: Scalar configuration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run generate:configuration
      - name: Verify generated configuration
        run: |
          git ls-files --error-unmatch -- config/scalar.php
          git diff --exit-code -- config/scalar.php

  generate:
    if: >-
      github.repository == 'scalar/laravel' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --save-dev --save-exact --ignore-scripts @scalar/schemas@latest
      - run: npm run generate:configuration
      - name: Prepare update
        id: diff
        run: |
          if ! git diff --quiet -- config/scalar.php; then
            git diff -- package.json package-lock.json config/scalar.php > "$RUNNER_TEMP/scalar-configuration.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: scalar-configuration-update
          path: ${{ runner.temp }}/scalar-configuration.patch
          retention-days: 1
          if-no-files-found: error

  pull-request:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: scalar-configuration-update
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: scalar-configuration-update
          path: ${{ runner.temp }}/scalar-configuration-update
      - name: Apply generated update
        run: >-
          git apply --include=package.json --include=package-lock.json --include=config/scalar.php
          "$RUNNER_TEMP/scalar-configuration-update/scalar-configuration.patch"
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          branch: automation/scalar-configuration
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
            config/scalar.php
          commit-message: 'docs: update Scalar configuration options'
          title: 'Update Scalar configuration options'
          body: Regenerate the configuration reference from the latest @scalar/schemas.
