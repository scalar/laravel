name: Scalar configuration

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'scalar/laravel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      attempt: ${{ steps.diff.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --save-dev --save-exact --ignore-scripts @scalar/schemas@latest
      - run: npm run generate:configuration
      - name: Prepare update
        id: diff
        run: |
          if ! git diff --quiet -- config/scalar.php; then
            git diff -- package.json package-lock.json config/scalar.php > "$RUNNER_TEMP/scalar-configuration.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: scalar-configuration-update-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-configuration.patch
          retention-days: 1
          if-no-files-found: error

  pull-request:
    needs: generate
    # Publisher-only retries reuse previous outputs. Publishing requires fresh generation.
    if: needs.generate.outputs.attempt == github.run_attempt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        if: needs.generate.outputs.changed == 'true'
        with:
          name: scalar-configuration-update-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-configuration-update
      - name: Pin the pull request base
        # Give create-pull-request the named base at the generation commit.
        run: |
          git update-ref refs/remotes/origin/main HEAD
          git switch --create main --track origin/main
      - name: Apply generated update
        if: needs.generate.outputs.changed == 'true'
        run: |
          git apply --include=package.json --include=package-lock.json --include=config/scalar.php \
            "$RUNNER_TEMP/scalar-configuration-update/scalar-configuration.patch"
      - name: Check current main before publishing
        id: verify-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$(git rev-parse HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping Scalar configuration PR update because main advanced after generation."
          fi
      # A clean checkout lets the action close an obsolete update pull request.
      - uses: peter-evans/create-pull-request@v8.1.3
        if: steps.verify-base.outputs.current == 'true'
        with:
          base: main
          branch: automation/scalar-configuration
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
            config/scalar.php
          commit-message: 'docs: update Scalar configuration options'
          title: 'Update Scalar configuration options'
          body: Regenerate the configuration reference from the latest @scalar/schemas.
