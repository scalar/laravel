name: Fix PHP code style issues

on:
  push:
    branches: ['**']
    paths:
      - '**.php'
      - 'composer.json'
      - 'pint.json'
      - '.github/workflows/fix-php-code-style-issues.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Fix PHP code style issues
        run: composer format

      - name: Commit changes
        id: formatting
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          branch: ${{ github.ref_name }}
          commit_message: Fix styling
          file_pattern: '*.php'

      - name: Check the formatting commit
        if: steps.formatting.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_BRANCH: ${{ github.ref_name }}
        # GITHUB_TOKEN pushes do not trigger push workflows. Explicit dispatches
        # ensure that the new commit receives the same checks as the original.
        run: |
          gh workflow run run-tests.yml --repo "$GITHUB_REPOSITORY" --ref "$FORMAT_BRANCH"
          gh workflow run check-php-code-style.yml --repo "$GITHUB_REPOSITORY" --ref "$FORMAT_BRANCH"
          gh workflow run code-quality.yml --repo "$GITHUB_REPOSITORY" --ref "$FORMAT_BRANCH"
          gh workflow run check-workflows.yml --repo "$GITHUB_REPOSITORY" --ref "$FORMAT_BRANCH"
